/* V6 — Ant Design-inspired enterprise refinement, preserving MiSans and existing UI interactions */
:root{
  --bg:#f5f7fa;--paper:#ffffff;--line:#e8ebf0;--ink:#202b3d;
  --muted:#778397;--soft:#f7f9fc;--accent:#1677ff;--light:#eaf3ff;
  --green:#389e78;--amber:#d48806;--red:#cf4b4b;--sidebar:#ffffff;
  --shadow:0 1px 2px rgba(18,36,65,.035);
  --ant-radius:8px;--ant-motion:.16s ease;
}
html,body{font-family:"MiSans VF","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.55}
body{background:var(--bg)}
button,input,select,textarea{font-family:inherit}
button,input,select{transition:background var(--ant-motion),border-color var(--ant-motion),box-shadow var(--ant-motion),color var(--ant-motion)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid rgba(22,119,255,.38);outline-offset:2px}
.sidebar{width:236px;background:#fff;border-color:#eef0f3}
.brand{height:73px;padding:17px 20px;border-bottom:1px solid #f0f0f0}
.logo{background:#1677ff;border-radius:8px;box-shadow:none;width:34px;height:34px}
.brand strong{font-size:16px;font-weight:710;letter-spacing:-.25px}
.brand small{font-size:10px;letter-spacing:.7px}
.nav{padding:14px 11px}
.navlabel{letter-spacing:.3px;color:#a0aaba;font-size:10.5px;padding:13px 12px 7px}
.nav button{height:40px;border-radius:7px;font-size:13px;color:#506078;gap:11px;margin:1px 0}
.nav button:hover{background:#f5f8fd;color:#1677ff}
.nav button.active{background:#eaf3ff;color:#1768d1;font-weight:650}
.nav button.group{color:#344054}
.subnav{padding-left:26px}
.subnav button{height:36px;font-size:12.5px;padding-left:10px}
.navhr{background:#edf0f3;margin:12px 12px}
.foot{border-color:#f0f0f0;padding:13px 17px}
.avatar{background:#edf5ff;color:#1767cd;border-radius:50%}
.top{height:65px;background:#fff;border-color:#edf0f3;padding:0 35px}
.topBtn{border:1px solid #d9dfe8;border-radius:6px;color:#4d5d73;background:#fff}
.topBtn:hover{border-color:#91caff;color:#1677ff}
.container{padding:29px 34px 70px;max-width:1490px}
.title{font-size:25px;letter-spacing:-.65px;font-weight:720}
.eyebrow{font-size:10px;color:#8090a5;letter-spacing:.75px}
.subtitle{font-size:12.5px;color:#7d899b}
.header{margin-bottom:24px}
.panel{border:1px solid #e7ebf0;border-radius:9px;box-shadow:0 1px 2px rgba(34,55,85,.025)}
.panelhead{padding:18px 20px 15px}
.panelhead h3{font-weight:680;font-size:14px}
.panelbody{padding:0 20px 21px}
.metric{padding:19px 21px;min-height:114px}
.metric label{font-size:12px}
.metric b{font-size:28px;margin-top:13px;font-weight:720}
.metric .pin{top:19px;right:19px}
.grid{gap:14px}
.section{margin-top:18px}
.btn{min-height:36px;border-radius:6px;border-color:#d9dfe8;font-size:12.5px;padding:8px 15px;font-weight:610}
.btn:hover{color:#1677ff;border-color:#91caff;background:#fff}
.btn.primary{background:#1677ff;border-color:#1677ff;color:#fff;box-shadow:0 2px 0 rgba(5,145,255,.07)}
.btn.primary:hover{background:#4096ff;border-color:#4096ff;color:white}
.btn.light{background:#eaf3ff;border-color:#d9eaff;color:#1767cf}

.tbl td{padding:13px 16px;border-color:#f1f3f6}
.tbl tbody tr:hover{background:#fafcff}

.pill{font-weight:560;border-radius:5px}

input,select{border-radius:6px}

</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">O.</div><div><strong>OHScanner</strong><small>SECURITY WORKSPACE</small></div></div><div class="workspace-chip"><div class="symbol">OH</div><div><b>官方社区审计工作区</b><small>固定源码 · 可追溯证据</small></div></div><div class="nav"><div class="navlabel">工作区</div><button data-page="overview" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg><span>总览</span></button><button class="group" id="navgroup"><span class="head"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 7v8M7 11h8"/></svg><span>新建审计</span></span><span class="chev" id="chev">▾</span></button><div class="subnav" id="subnav"><button data-page="reposcan"><span>仓库安全扫描</span></button><button data-page="deltascan"><span>时间增量扫描</span></button><button data-page="versions"><span>跨版本安全分析</span></button></div><div class="navhr"></div><button data-page="tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 10 2 2 5-5M8 17h8"/></svg><span>任务中心</span></button><button data-page="risks"><svg viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6z"/><path d="M12 8v5m0 3h.01"/></svg><span>风险中心</span></button><div class="navlabel">漏洞研判</div><button data-page="agent"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="3"/><path d="M12 3v4M8 12h.01M16 12h.01M9 16h6"/></svg><span>智能调查</span></button><button data-page="poc"><svg viewBox="0 0 24 24"><path d="M9 3h6m-5 0v8L4 20h16l-6-9V3M8 16h8"/></svg><span>PoC 验证</span></button><button data-page="fix"><svg viewBox="0 0 24 24"><path d="M6 3v10a4 4 0 0 0 4 4h4m-3-3 3 3-3 3M6 7h8a4 4 0 0 1 4 4v10"/></svg><span>影响与修复</span></button><button data-page="reports"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg><span>报告中心</span></button><div class="navhr"></div><button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>系统设置</span></button></div><div class="foot"><div class="avatar">OS</div><div><strong>Local workspace</strong><small>MiSans · Design V8</small></div></div></aside><div class="main"><header class="top"><div class="crumb">OHScanner <span style="padding:0 8px;color:#c0c7cf">/</span> <b id="crumb">总览</b></div><div class="topright"><span class="live"><i class="dot"></i> 演示环境</span><span class="mono">V8 · Blue Workspace</span><button class="topBtn" onclick="toast('这是独立界面原型，没有连接真实服务')">关于原型</button></div></header><main class="container" id="view"></main></div></div><div class="toast" id="toast"></div><script>
const names={overview:'总览',reposcan:'仓库安全扫描',deltascan:'时间增量扫描',versions:'跨版本安全分析',tasks:'任务中心',risks:'风险中心',agent:'智能调查',poc:'PoC 验证',fix:'影响与修复',reports:'报告中心',settings:'系统设置'};let page='overview';const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;const H=(name,sub,actions='')=>`<div class="header"><div><div class="eyebrow">OHScanner / ${name==='总览'?'WORKSPACE':'SECURITY AUDIT'}</div><h1 class="title">${name}</h1><p class="subtitle">${sub}</p></div><div class="actions">${actions}</div></div>`;const b=(txt,p='')=>`<button class="btn ${p}" onclick="${p==='primary'?'toast(\'这是界面交互预览，尚未连接真实扫描后端\')':'toast(\'演示功能：'+txt+'\')'}">${txt}</button>`;const tbl=(heads,rows)=>`<table class="tbl"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;function overview(){return H('总览','统一管理 OpenHarmony 官方源码审计、风险调查和验证工作。',`<button class="btn primary" onclick="go('reposcan')">＋ 新建审计</button>`)+`<div class="asideHint">演示数据 · 此页面仅用于视觉与交互评审，并非当前实际扫描统计</div><div class="grid four"><div class="panel metric"><label>已登记官方仓库</label><b>06</b><small>来自历史集成实验记录</small><span class="pin">⌘</span></div><div class="panel metric"><label>本期审计任务</label><b>24</b><small>演示数据 / 最近 30 天</small><span class="pin">↗</span></div><div class="panel metric"><label>待复核风险组</label><b>12</b><small>演示数据 / 尚未确认</small><span class="pin">◇</span></div><div class="panel metric"><label>已确认漏洞</label><b>00</b><small>当前已知确认数量</small><span class="pin">✓</span></div></div><div class="grid two section"><section class="panel tablepanel"><div class="panelhead"><h3>最近审计任务</h3><a class="link small" onclick="go('tasks')">查看全部 →</a></div>${tbl(['审计目标','类型','状态','最后更新'],[['<strong>communication_ipc</strong><br><span class="tiny">master · 固定 SHA</span>','仓库扫描',pill('已完成','green'),'10 分钟前'],['<strong>社区主分支 · 最近 15 天</strong><br><span class="tiny">范围任务 / 示意</span>','增量扫描',pill('执行中','blue'),'32 分钟前'],['<strong>security_access_token</strong><br><span class="tiny">两个版本端点对比</span>','跨版本',pill('待分析','amber'),'昨天'],['<strong>distributeddatamgr_kv_store</strong><br><span class="tiny">静态候选聚类</span>','仓库扫描',pill('已完成','green'),'昨天']])}</section><section class="panel"><div class="panelhead"><h3>能力与覆盖</h3><span class="tiny">研发状态示意</span></div><div class="panelbody"><div class="hbar"><span>C/C++ 自研检测</span><b>已接入基础</b></div><div class="bar"><span style="width:64%"></span></div><div class="hbar"><span>ArkTS / ETS 规则</span><b>规划扩展</b></div><div class="bar"><span style="width:12%;background:#a1b2c1"></span></div><div class="hbar"><span>JavaScript / TS 规则</span><b>规划扩展</b></div><div class="bar"><span style="width:12%;background:#a1b2c1"></span></div><div class="hline"></div><div class="notice"><strong>关于扫描完整性</strong><br>未分析和部分解析的文件会单独记录。候选数量不等于确认漏洞数量，图中的进度条仅表示产品设计示意。</div></div></section></div><section class="panel section"><div class="panelhead"><h3>建议继续处理</h3><span class="tiny">演示工作项</span></div><div class="grid three" style="padding:0 23px 23px"><div class="inset"><b>核查 IPC 风险证据</b><p class="subtitle">查看权限守卫、函数入口与调用者身份。</p><a class="link small" onclick="go('agent')">进入智能调查 →</a></div><div class="inset"><b>隔离验证准备</b><p class="subtitle">检查运行环境、固定源码和 PoC 审批状态。</p><a class="link small" onclick="go('poc')">查看 PoC 验证 →</a></div><div class="inset"><b>社区批量审计</b><p class="subtitle">对官方仓库主分支执行近 15 天的变更检查。</p><a class="link small" onclick="go('deltascan')">配置增量扫描 →</a></div></div></section>`}
function scan(){return H('仓库安全扫描','选择一个或多个官方仓库，或对已核验的整个社区执行全量源码审计。')+`<div class="grid two"><section class="panel formpanel"><h3 class="sectionTitle">01 / 扫描范围</h3><div class="seg" id="scope"><button class="sel" onclick="pick(this,'scope')">指定仓库</button><button onclick="pick(this,'scope')">全部官方仓库</button></div><div class="formgroup field"><label>查找官方仓库</label><input value="communication_ipc" placeholder="输入组件或仓库名称"/></div><div class="formgroup"><div class="chips"><span class="chip">communication_ipc ×</span><span class="chip">security_access_token ×</span><span class="chip">+ 添加仓库</span></div></div><div class="hline"></div><h3 class="sectionTitle">02 / 版本与范围</h3><div class="formcols"><div class="field"><label>默认版本</label><select><option>各仓库默认主分支（固定最新 SHA）</option><option>手动指定 SHA</option></select></div><div class="field"><label>扫描模式</label><select><option>全量安全扫描</option><option>仅选择目录</option></select></div></div><label class="choice"><input type="checkbox"/> 包含已归档官方仓库 <small>默认不包含</small></label><div class="hline"></div><div class="row"><span class="tiny">系统自动执行适用的自研检测能力</span><button class="btn primary" onclick="toast('配置已展示；此预览不会创建真实扫描任务')">开始扫描 →</button></div></section><section><div class="panel"><div class="panelhead"><h3>运行说明</h3></div><div class="panelbody"><div class="notice">首次同步源码会在本地创建 Git 缓存，后续使用 fetch 更新。每次扫描会固定各仓库自己的 Commit SHA。全社区任务由后台按仓库与分析单元分批执行。</div><div class="hline"></div><h3 class="sectionTitle">任务执行策略</h3><div class="statusLine"><i></i> 多仓库并发调度与资源限额</div><div class="statusLine"><i></i> 文件分片、失败重试与暂停恢复</div><div class="statusLine"><i></i> 完整 / 部分 / 未分析分别统计</div><div class="statusLine"><i></i> 检测来源仅在结果详情展示</div></div></div></section></div>`}
function delta(){return H('时间增量扫描','选择时间窗口，审计期间发生变化的源码和必要的关联上下文。')+`<div class="grid two"><section class="panel formpanel"><h3 class="sectionTitle">01 / 目标范围</h3><div class="seg" id="deltaScope"><button onclick="pick(this,'deltaScope')">单个仓库</button><button onclick="pick(this,'deltaScope')">多个仓库</button><button class="sel" onclick="pick(this,'deltaScope')">全部官方主分支</button></div><div class="formgroup"><h3 class="sectionTitle">02 / 时间窗口</h3><div class="seg" id="period"><button onclick="pick(this,'period')">最近 7 天</button><button class="sel" onclick="pick(this,'period')">最近 15 天</button><button onclick="pick(this,'period')">最近 30 天</button><button onclick="pick(this,'period')">自定义</button></div></div><div class="formgroup formcols"><div class="field"><label>起始日期</label><input type="date" value="2026-10-02"/></div><div class="field"><label>结束日期</label><input type="date" value="2026-10-17"/></div></div><div class="formgroup"><label class="choice sel"><input checked type="checkbox"/> 包含变更函数的相关安全上下文</label></div><div class="hline"></div><div class="row"><span class="tiny">仅使用已核验的官方仓库与固定版本</span><button class="btn primary" onclick="toast('这是时间增量审计的前端概念交互')">开始增量审计 →</button></div></section><section class="panel"><div class="panelhead"><h3>近 15 天审计概览</h3><span class="tiny">示例数据</span></div><div class="panelbody"><div class="grid two"><div class="inset"><div class="tiny">发现活跃仓库</div><h2 style="margin:12px 0 0;font-size:29px">73</h2></div><div class="inset"><div class="tiny">变更文件</div><h2 style="margin:12px 0 0;font-size:29px">1,284</h2></div></div><div class="hline"></div><div class="notice">全社区增量范围需冻结仓库清单、主分支和提交集合。Git 提交时间与实际进入主分支的时间不同；系统应明确口径和未知项。</div><div style="margin-top:24px"><h3 class="sectionTitle">变更集中区域 · 演示</h3><div class="hbar"><span>IPC / 权限</span><b>36%</b></div><div class="bar"><span style="width:36%"></span></div><div class="hbar"><span>系统服务</span><b>27%</b></div><div class="bar"><span style="width:27%"></span></div><div class="hbar"><span>公共库</span><b>19%</b></div><div class="bar"><span style="width:19%"></span></div></div></div></section></div>`}
function versions(){return H('跨版本安全分析','比较同一仓库的不同分支、Tag 或 Commit；版本影响必须以证据支持。')+`<div class="grid two"><section class="panel formpanel"><h3 class="sectionTitle">选择比较对象</h3><div class="field"><label>官方仓库</label><select><option>communication_ipc</option><option>security_access_token</option></select></div><div class="formcols formgroup"><div class="field"><label>基线版本 A</label><input value="master @ 5903fd5f"/></div><div class="field"><label>目标版本 B</label><input placeholder="选择 Branch / Tag / Commit"/></div></div><div class="formgroup"><div class="seg" id="cmp"><button class="sel" onclick="pick(this,'cmp')">双版本比较</button><button onclick="pick(this,'cmp')">多版本矩阵</button></div></div><div class="hline"></div><div class="row"><span class="tiny">按仓库实际 SHA 固定比较端点</span>${b('开始分析','primary')}</div></section><section class="panel"><div class="panelhead"><h3>影响判定原则</h3></div><div class="panelbody"><div class="notice">单纯 diff 或候选消失只能说明静态检测变化，不能自动断言漏洞已修复。真正的“受影响 / 已修复”需要结合源码语义、入口条件和必要的隔离验证。</div><div class="hline"></div><div class="chips">${pill('affected · 待核验','amber')}${pill('fixed · 待核验','green')}${pill('unknown')}</div></div></section></div>`}
function tasks(){return H('任务中心','跟踪扫描执行、覆盖缺口、排队状态、资源预算与任务恢复。',`<button class="btn primary" onclick="go('reposcan')">＋ 创建扫描</button>`)+`<section class="panel tablepanel"><div class="panelhead"><h3>所有任务</h3><span class="tiny">记录为 UI 演示数据</span></div>${tbl(['任务','模式','仓库数','覆盖','状态','操作'],[['<strong>2026-10-17 社区主分支</strong>','15 天增量','73','18 / 73',pill('执行中','blue'),'<a class="link" onclick="toast(\'演示操作：查看进度\')">详情 →</a>'],['<strong>communication_ipc</strong>','仓库全量','1','260 / 320',pill('部分覆盖','amber'),'<a class="link" onclick="go(\'risks\')">查看风险 →</a>'],['<strong>security_access_token</strong>','跨版本','1','两端点完成',pill('已完成','green'),'<a class="link" onclick="go(\'fix\')">查看矩阵 →</a>'],['<strong>distributeddatamgr_kv_store</strong>','仓库全量','1','1126 / 1446',pill('已完成','green'),'<a class="link" onclick="go(\'risks\')">查看候选 →</a>']])}</section><section class="panel section"><div class="panelhead"><h3>批量任务恢复</h3></div><div class="panelbody"><div class="notice">全仓扫描遇到网络或资源故障时，任务应保存已完成仓库和分片结果；恢复时只继续未完成部分。前端不把“任务已结束”错误地显示成“覆盖完整”。</div></div></section>`}
function risks(){return H('风险中心','以可调查的问题组组织候选；原始检测记录和源码证据始终可展开。')+`<div class="grid four"><div class="panel metric"><label>候选观察</label><b>252</b><small>演示汇总</small></div><div class="panel metric"><label>可审阅问题组</label><b>48</b><small>不是 48 个确认漏洞</small></div><div class="panel metric"><label>调查中的案例</label><b>07</b><small>演示数据</small></div><div class="panel metric"><label>已确认漏洞</label><b>00</b><small>没有完成真实验证</small></div></div><section class="panel tablepanel section"><div class="panelhead"><h3>风险问题</h3><button class="btn" onclick="toast('演示筛选选项')">筛选  ·  待复核</button></div>${tbl(['风险问题','位置 / 仓库','类型','状态','操作'],[['<strong>IPC 调用边界疑似权限缺口</strong><br><span class="tiny">多条检测记录已归并</span>','communication_ipc<br><span class="mono muted">ipc/native/…</span>','CWE 候选',pill('待调查','amber'),'<a class="link" onclick="go(\'agent\')">调查 →</a>'],['<strong>shared_ptr 成员访问竞争</strong><br><span class="tiny">180 条观测 / 9 组</span>','distributeddatamgr_kv_store','CWE-362 候选',pill('待复核','amber'),'<a class="link" onclick="go(\'agent\')">查看 →</a>'],['<strong>智能指针生命周期疑点</strong>','update_updateservice','UAF 候选',pill('证据不足'),'<a class="link" onclick="go(\'agent\')">查看 →</a>']])}</section>`}
function agent(){return H('智能调查','以源码和工具证据为基础的 Agent 研究工作台，而非自由聊天式漏洞裁判。',`<button class="btn" onclick="toast('演示：模型设置位于系统设置')">模型配置</button>`)+`<div class="grid two"><section class="panel"><div class="panelhead"><h3>调查工作区</h3>${pill('候选 · 未确认','amber')}</div><div class="panelbody"><div class="inset"><div class="tiny">CASE-IPC-001 / 来源仓库</div><h3 style="font-size:16px;margin:11px 0 8px">IPC 接口权限检查疑点</h3><span class="mono muted">communication_ipc @ pinned SHA</span></div><h3 class="sectionTitle" style="margin-top:25px">调查时间线</h3><div class="timeline"><div class="step"><strong>定位候选代码和接口入口</strong><small>需绑定源码哈希、位置与原始检测证据</small></div><div class="step"><strong>查找上游身份与权限守卫</strong><small>调用链、跨函数条件、调用者控制能力</small></div><div class="step"><strong>核查可能的安全后果</strong><small>访问了什么能力、是否有攻击者实际可控输入</small></div><div class="step"><strong>提交隔离验证方案</strong><small>需人工审批，不在宿主机运行任意生成代码</small></div></div><div class="row"><button class="btn" onclick="toast('示意：查看只读调用日志')">工具调用记录</button><button class="btn primary" onclick="go('poc')">进入 PoC 验证 →</button></div></div></section><section class="panel"><div class="panelhead"><h3>当前证据义务</h3><span class="tiny">Agent 不得自行关闭证据门</span></div><div class="panelbody"><div class="activityrow"><span class="square">01</span><div><b>调用入口可达性</b><span>确认攻击者输入是否能到达真实产品入口</span></div>${pill('未知')}</div><div class="activityrow"><span class="square">02</span><div><b>权限守卫有效性</b><span>检查 dispatcher 和上游的权限保护</span></div>${pill('待核查','amber')}</div><div class="activityrow"><span class="square">03</span><div><b>潜在安全影响</b><span>需要真实数据、权限或执行后果证据</span></div>${pill('未知')}</div><div class="hline"></div><div class="notice"><strong>真实实现边界</strong><br>当前 GitHub 已有只读调查轨迹，但真实 LLM 模型调用未完成。此页面展示未来目标交互，不代表 Agent 已经自动验证漏洞。</div><div class="formgroup"><div class="field"><label>调查备注（界面体验示例）</label><input id="note" placeholder="记录待核对的调用链或疑问…"/></div><button class="btn" style="margin-top:12px" onclick="toast('演示备注：'+(document.getElementById('note').value||'空'))">添加备注</button></div></div></section></div>`}
function poc(){return H('PoC 验证','仅在受控隔离环境中验证特定候选；记录环境、结果和重复实验。')+`<div class="grid two"><section class="panel"><div class="panelhead"><h3>PoC 验证工单</h3>${pill('等待运行环境','amber')}</div><div class="panelbody"><div class="field"><label>关联研究案例</label><select><option>CASE-IPC-001 · IPC 权限边界</option><option>CASE-CPP-002 · 生命周期</option></select></div><div class="formgroup formcols"><div class="field"><label>验证对象</label><select><option>修复前源码（vulnerable）</option><option>修复后源码（fixed）</option><option>修复补丁（patched）</option></select></div><div class="field"><label>运行模式</label><select><option>隔离 Docker / 无网络</option></select></div></div><div class="formgroup"><label class="choice sel"><input type="checkbox" checked/> 人工审批后才能执行</label><label class="choice sel"><input type="checkbox" checked/> 保存构建日志、控制组、重复验证与哈希</label></div><div class="hline"></div><button class="btn primary" onclick="toast('当前是 UI 原型，不会运行 PoC')">提交受控验证申请 →</button></div></section><section class="panel"><div class="panelhead"><h3>验证证据与状态</h3></div><div class="panelbody"><div class="notice"><strong>当前真实状态</strong><br>历史开发记录中 AUTH-01 Docker-only 验证框架已搭建，但本地 Docker daemon / 固定镜像尚不满足运行条件。该限制在正式面板中必须明确显示。</div><div class="hline"></div><h3 class="sectionTitle">三组对照要求</h3>${tbl(['对象','环境','结果'],[['修复前版本','固定镜像',pill('待执行')],['修复后版本','相同环境',pill('待执行')],['补丁版本','相同环境',pill('待执行')]])}<p class="caption">演示表格不是实际 PoC 运行结果。</p></div></section></div>`}
function fix(){return H('影响与修复','围绕同一安全问题核查版本影响、补丁建议和修复后复现结果。')+`<div class="grid two"><section class="panel tablepanel"><div class="panelhead"><h3>分支影响矩阵</h3><span class="tiny">示例 · 全部待核验</span></div>${tbl(['分支 / 版本','候选观察','安全影响'],[['master',pill('观察到','amber'),pill('unknown')],['OpenHarmony-5.0-Release',pill('未完成比较'),pill('unknown')],['OpenHarmony-4.1-Release',pill('未完成比较'),pill('unknown')]])}</section><section class="panel"><div class="panelhead"><h3>修复建议工作流</h3></div><div class="panelbody"><div class="timeline"><div class="step"><strong>定位根因</strong><small>合并源码、程序路径和 PoC 证据</small></div><div class="step"><strong>形成最小修复建议</strong><small>优先处理边界校验或权限守卫的真实缺口</small></div><div class="step"><strong>修复前后复验</strong><small>同条件验证漏洞行为变化与功能回归</small></div></div><button class="btn" onclick="go('reports')">查看报告中心 →</button></div></section></div>`}
function reports(){return H('报告中心','导出含源码证据、CWE / 已知 CVE、PoC、影响范围、补丁与性能的完整审计材料。')+`<section class="panel tablepanel"><div class="panelhead"><h3>报告列表</h3><button class="btn" onclick="toast('演示：导出比赛报告')">创建报告</button></div>${tbl(['报告名称','范围','包含内容','状态','操作'],[['<strong>CASE-IPC-001 风险调查报告</strong>','单一案例','源码 / CWE / 证据缺口',pill('草稿','amber'),'<a class="link" onclick="toast(\'演示：报告详情\')">查看 →</a>'],['<strong>社区最近 15 天审计摘要</strong>','官方主分支','仓库清单 / 覆盖 / 性能',pill('待完成'),'<a class="link" onclick="toast(\'演示：报告详情\')">查看 →</a>'],['<strong>工具性能与评估报告</strong>','固定对照样本','耗时 / 内存 / 精度',pill('规划中'),'<a class="link" onclick="toast(\'演示：报告详情\')">查看 →</a>']])}</section><section class="panel section"><div class="panelhead"><h3>比赛报告要求</h3></div><div class="panelbody"><div class="chips">${['源码定位','CWE / 已公开 CVE','PoC 源码','隔离复现证据','影响模块与版本','修复建议','扫描性能','限制说明'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div></section>`}
function settings(){return H('系统设置','管理官方来源、模型服务、存储与审计能力；普通扫描不需要配置检测器。')+`<div class="grid two"><section class="panel formpanel"><h3 class="sectionTitle">源码来源与缓存</h3><div class="field"><label>首选官方托管平台</label><select><option>GitCode / openharmony</option><option>核验后的官方镜像</option></select></div><div class="formgroup field"><label>本地 Git 缓存</label><input value="/home/audit/ohscanner/source-cache"/></div><div class="hline"></div><h3 class="sectionTitle">运行资源</h3><div class="formcols"><div class="field"><label>仓库任务并发</label><select><option>2（建议初始值）</option><option>1</option><option>4</option></select></div><div class="field"><label>数据保留</label><select><option>固定证据持久化</option></select></div></div></section><section class="panel formpanel"><h3 class="sectionTitle">智能调查与能力状态</h3><div class="row"><div><b>Agent 模型连接</b><p class="subtitle">当前开发基线尚未接入真实 LLM</p></div>${pill('未连接')}</div><div class="hline"></div><div class="row"><div><b>PoC 隔离执行</b><p class="subtitle">需要 Docker daemon、镜像和独立审批</p></div>${pill('环境受阻','amber')}</div><div class="hline"></div><div class="row"><div><b>C/C++ 自研规则</b><p class="subtitle">IPC / 生命周期 / shared_ptr 规则基础</p></div>${pill('已有基础','green')}</div><div class="hline"></div><div class="row"><div><b>ArkTS / JavaScript</b><p class="subtitle">多语言适配和规则库待扩展</p></div>${pill('规划中')}</div></section></div>`}
const originalOverview=overview; const overviewWithNotice=()=>'<div class="reference-banner">演示原型 · 所有数据为界面示例，真实扫描、Agent 与 PoC 需要连接 OHScanner 后端服务。</div>'+originalOverview(); const pages={overview:overviewWithNotice,reposcan:scan,deltascan:delta,versions,tasks,risks,agent,poc,fix,reports,settings};function go(p){page=p;document.getElementById('view').innerHTML=pages[p]();document.getElementById('crumb').textContent=names[p];document.querySelectorAll('.nav [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));window.location.hash='#/'+p;window.scrollTo({top:0,behavior:'instant'});}function pick(el,id){document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');if(id==='scope'){const input=document.querySelector('.field input');if(input)input.disabled=el.textContent.includes('全部');}}let time;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(time);time=setTimeout(()=>t.style.display='none',2800)}document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));document.getElementById('navgroup').addEventListener('click',()=>{const s=document.getElementById('subnav');s.classList.toggle('hidden');document.getElementById('chev').textContent=s.classList.contains('hidden')?'▸':'▾'});go(names[(location.hash||'').replace('#/','')]?location.hash.replace('#/',''):'overview');window.addEventListener('hashchange',()=>{const p=location.hash.replace('#/','');if(pages[p]&&p!==page)go(p)});
</script></body></html>
