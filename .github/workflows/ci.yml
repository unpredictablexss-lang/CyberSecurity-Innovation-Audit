name: CI

on:
  push:
    branches:
      - main
      - feat/ohscanner-core
      - feat/owner-ipc-platform-integration
      - feat/workbench-*
      - feat/openharmony-target-onboarding
      - integration/**
      - work/**
  pull_request:
    branches:
      - main
      - feat/ohscanner-core
      - feat/owner-ipc-platform-integration
      - feat/workbench-integration
      - integration/**

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-22.04
    needs: workbench-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      - name: Download production UI assets
        uses: actions/download-artifact@v4
        with:
          name: workbench-web-dist
          path: web/dist

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  workbench-web:
    name: Workbench TypeScript and production build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked UI dependencies
        working-directory: web
        run: npm ci
      - name: Run UI regressions
        working-directory: web
        run: npm test
      - name: Type-check and bundle offline UI assets
        working-directory: web
        run: npm run build
      - name: Upload production UI assets for Python integration tests
        uses: actions/upload-artifact@v4
        with:
          name: workbench-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
