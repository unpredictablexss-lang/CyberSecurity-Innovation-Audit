name: CI

on:
  push:
    branches:
      - main
      - feat/ohscanner-core
      - feat/owner-ipc-platform-integration
      - feat/workbench-*
      - feat/openharmony-target-onboarding
  pull_request:
    branches:
      - main
      - feat/ohscanner-core
      - feat/owner-ipc-platform-integration
      - feat/workbench-integration

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show Python version
        run: python --version

      - name: Check documentation context budgets
        run: python scripts/check_docs_context_budget.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  workbench-web:
    name: Workbench TypeScript and production build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked UI dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and bundle offline UI assets
        working-directory: web
        run: npm run build
